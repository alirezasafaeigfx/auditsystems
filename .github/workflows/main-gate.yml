name: main-gate

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-gate-${{ github.repository }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [self-hosted, linux, x64, asdev-ci]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install secret-scan tool
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Scan tracked source for secrets
        run: pnpm run scan:secrets

      - name: Run automation hard gate
        env:
          APP_BASE_URL: "http://localhost:3000"
          DOWNLOAD_TOKEN_SECRET: "ci-download-secret-min-16"
          PAYMENT_PROVIDER_DEFAULT: "MOCK"
          REQUIRE_DISTRIBUTED_RATE_LIMIT: "false"
        run: pnpm run automation:run

      - name: Curl smoke /asdev
        run: |
          pnpm run build
          PORT=3110 pnpm run start >/tmp/audit-smoke.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID >/dev/null 2>&1 || true" EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3110/asdev >/tmp/asdev.html; then
              break
            fi
            sleep 1
          done
          grep -q "Alireza Safaei" /tmp/asdev.html
          grep -q "alireza_safaei_network" /tmp/asdev.html
          GET_CODE="$(curl -sS -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:3110/api/ready)"
          HEAD_CODE="$(curl -sSI -o /tmp/ready.head -w '%{http_code}' -X HEAD http://127.0.0.1:3110/api/ready)"
          test "${GET_CODE}" = "200"
          test "${HEAD_CODE}" = "${GET_CODE}"
          grep -q '"status":"ready"' /tmp/ready.json || grep -q '"status":"degraded"' /tmp/ready.json

      - name: Upload automation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-gate-artifacts
          path: |
            logs/roadmap/
            logs/preflight/
            docs/AUTO_GENERATED_STATUS.md
