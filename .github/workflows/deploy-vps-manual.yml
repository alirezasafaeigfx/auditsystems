name: deploy-vps-manual

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
      release_ref:
        description: "Git ref (tag/branch/SHA)"
        required: true
        default: "main"
      approved:
        description: "Type YES to confirm real deployment"
        required: true
        default: "NO"

env:
  VPS_BASE_DIR: /var/www/asdev-audit-ir
  PUBLIC_URL: https://audit.alirezasafaeisystems.ir
  PUBLIC_HEALTH: /api/ready
  PROD_PORT: "3010"
  STAGING_PORT: "3011"

jobs:
  deploy:
    if: github.event.inputs.approved == 'YES'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
    outputs:
      deploy_status: ${{ steps.deploy.outcome }}
      smoke_status: ${{ steps.smoke.outcome }}
      release_id: ${{ steps.release_id.outputs.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.release_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build & validate
        run: |
          pnpm run check
          pnpm run build

      - name: Generate release ID
        id: release_id
        run: |
          RELEASE_ID="$(date -u +%Y%m%dT%H%M%SZ)-gh-${{ github.run_number }}"
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Release ID: $RELEASE_ID"

      - name: Package artifact
        run: |
          tar -czf /tmp/asdev-audit-ir-${{ steps.release_id.outputs.id }}.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.venv' \
            --exclude='coverage' \
            --exclude='artifacts' \
            --exclude='reports' \
            --exclude='logs' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.env.production' \
            --exclude='.env.staging' \
            .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        id: deploy
        env:
          SSH_KEY: ~/.ssh/deploy_key
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          ENV: ${{ github.event.inputs.environment }}
          RELEASE_ID: ${{ steps.release_id.outputs.id }}
        run: |
          REMOTE_TMP="/tmp/asdev-audit-ir-${RELEASE_ID}"

          echo "==> Uploading release bundle..."
          rsync -az --delete \
            -e "ssh -i $SSH_KEY -p $SSH_PORT -o StrictHostKeyChecking=no" \
            /tmp/asdev-audit-ir-${RELEASE_ID}.tar.gz \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_TMP}.tar.gz"

          echo "==> Running remote deploy..."
          ssh -i "$SSH_KEY" -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" bash -s <<REMOTE_DEPLOY
          set -euo pipefail

          BASE_DIR="${{ env.VPS_BASE_DIR }}"
          SHARED_DIR="\$BASE_DIR/shared"
          ENV_FILE="\$SHARED_DIR/env/${ENV}.env"
          RELEASES_DIR="\$BASE_DIR/releases/${ENV}"
          CURRENT_LINK="\$BASE_DIR/current/${ENV}"
          RELEASE_DIR="\$RELEASES_DIR/${RELEASE_ID}"
          PORT="${ENV:+3010}"
          [[ "${ENV}" == "staging" ]] && PORT="3011"
          APP_NAME="asdev-audit-ir-${ENV}"

          # Save current release for rollback
          PREV_RELEASE=""
          if [[ -L "\$CURRENT_LINK" ]]; then
            PREV_RELEASE="\$(readlink -f "\$CURRENT_LINK")"
            echo "[deploy] previous release: \$PREV_RELEASE"
          fi

          # Extract release
          mkdir -p "\$RELEASE_DIR"
          tar -xzf "${REMOTE_TMP}.tar.gz" -C "\$RELEASE_DIR"
          rm -f "${REMOTE_TMP}.tar.gz"

          # Install + build + migrate
          cd "\$RELEASE_DIR"
          pnpm install --frozen-lockfile
          pnpm prisma generate

          set -a
          source "\$ENV_FILE"
          set +a

          export NODE_ENV=production
          export HOSTNAME=127.0.0.1
          export PORT

          pnpm prisma migrate deploy
          pnpm run build

          # Prepare standalone output
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/

          NODE_BIN="\$(command -v node)"
          WEB_NAME="\${APP_NAME}-web"
          WORKER_NAME="\${APP_NAME}-worker"
          LOG_DIR="\$SHARED_DIR/logs"

          # Write ecosystem config
          cat > ecosystem.config.cjs <<ECOSYSTEM
          module.exports = {
            apps: [
              {
                name: '\$WEB_NAME',
                cwd: '\$RELEASE_DIR',
                script: '\$NODE_BIN',
                args: '.next/standalone/server.js',
                env_file: '\$ENV_FILE',
                env: { NODE_ENV: 'production', HOSTNAME: '127.0.0.1', PORT: '\$PORT' },
                max_restarts: 10,
                restart_delay: 3000,
                out_file: '\$LOG_DIR/\$WEB_NAME.out.log',
                error_file: '\$LOG_DIR/\$WEB_NAME.err.log',
                merge_logs: true,
                time: true
              },
              {
                name: '\$WORKER_NAME',
                cwd: '\$RELEASE_DIR',
                script: 'pnpm',
                args: 'run worker:dev',
                env_file: '\$ENV_FILE',
                env: { NODE_ENV: 'production' },
                max_restarts: 10,
                restart_delay: 3000,
                out_file: '\$LOG_DIR/\$WORKER_NAME.out.log',
                error_file: '\$LOG_DIR/\$WORKER_NAME.err.log',
                merge_logs: true,
                time: true
              }
            ]
          };
          ECOSYSTEM

          # Restart services
          pm2 delete "\$WEB_NAME" 2>/dev/null || true
          pm2 delete "\$WORKER_NAME" 2>/dev/null || true
          pm2 start ecosystem.config.cjs --update-env
          pm2 save 2>/dev/null || true

          # Symlink current
          ln -sfn "\$RELEASE_DIR" "\$CURRENT_LINK"

          # Health check loop
          echo "[deploy] waiting for health check on port \$PORT..."
          for attempt in \$(seq 1 30); do
            if curl -fsS "http://127.0.0.1:\$PORT${{ env.PUBLIC_HEALTH }}" >/dev/null 2>&1; then
              echo "[deploy] health check PASSED on attempt \$attempt"
              exit 0
            fi
            sleep 2
          done
          echo "[deploy] health check FAILED after 30 attempts" >&2
          exit 1
          REMOTE_DEPLOY

      - name: Post-deploy smoke test
        id: smoke
        env:
          DEPLOY_ENV: ${{ github.event.inputs.environment }}
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
        run: |
          echo "==> Running smoke tests against ${PUBLIC_URL}..."
          PASS=0
          FAIL=0

          check() {
            local path="$1" expected="$2" desc="$3"
            local url="${PUBLIC_URL}${path}"
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" 2>/dev/null || echo "000")
            if [ "$status" = "$expected" ]; then
              echo "  ✓ ${desc} (${path}) -> ${status}"
              PASS=$((PASS + 1))
            else
              echo "  ✗ ${desc} (${path}) -> ${status} (expected ${expected})"
              FAIL=$((FAIL + 1))
            fi
          }

          echo "Health & readiness..."
          check "/api/ready" "200" "API ready"
          check "/api/health" "200" "API health"
          echo ""

          echo "Core pages..."
          check "/" "200" "Homepage"
          check "/audit" "200" "Audit form"
          check "/pricing" "200" "Pricing"
          check "/sample-report" "200" "Sample report"
          echo ""

          echo "API security..."
          check "/api/csrf" "200" "CSRF endpoint"
          check "/api/billing/current" "401" "Billing (unauth)"
          echo ""

          echo "Results: ${PASS} passed, ${FAIL} failed"
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::Smoke test failed with ${FAIL} failures"
            exit 1
          fi

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'success'
        env:
          SSH_KEY: ~/.ssh/deploy_key
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          ENV: ${{ github.event.inputs.environment }}
        run: |
          echo "==> Deploy succeeded but smoke test failed. Rolling back..."
          ssh -i "$SSH_KEY" -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" bash -s <<ROLLBACK
          set -euo pipefail
          BASE_DIR="${{ env.VPS_BASE_DIR }}"
          RELEASES_DIR="\$BASE_DIR/releases/${ENV}"
          CURRENT_LINK="\$BASE_DIR/current/${ENV}"

          # Find the previous release (second newest by timestamp)
          PREV_RELEASE=\$(ls -1dt "\$RELEASES_DIR"/* 2>/dev/null | sed -n '2p')
          if [[ -z "\$PREV_RELEASE" ]]; then
            echo "[rollback] no previous release found, cannot rollback"
            exit 1
          fi

          echo "[rollback] reverting to: \$PREV_RELEASE"
          ln -sfn "\$PREV_RELEASE" "\$CURRENT_LINK"

          # Restart with previous release
          cd "\$PREV_RELEASE"
          APP_NAME="asdev-audit-ir-${ENV}"
          PORT="${ENV:+3010}"
          [[ "${ENV}" == "staging" ]] && PORT="3011"

          pm2 delete "\${APP_NAME}-web" 2>/dev/null || true
          pm2 delete "\${APP_NAME}-worker" 2>/dev/null || true
          pm2 start ecosystem.config.cjs --update-env
          pm2 save 2>/dev/null || true

          echo "[rollback] complete"
          ROLLBACK

      - name: Deployment summary
        if: always()
        run: |
          ENV="${{ github.event.inputs.environment }}"
          REF="${{ github.event.inputs.release_ref }}"
          RUN="${{ github.run_id }}"
          DEPLOY="${{ steps.deploy.outcome }}"
          SMOKE="${{ steps.smoke.outcome }}"
          RELEASE="${{ steps.release_id.outputs.id }}"

          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`$ENV\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | \`$REF\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release ID | \`$RELEASE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | \`$DEPLOY\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke Test | \`$SMOKE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ env.PUBLIC_URL }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow Run | [#$RUN](https://github.com/${{ github.repository }}/actions/runs/$RUN) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$DEPLOY" = "success" ] && [ "$SMOKE" = "success" ]; then
            echo "**Status: SUCCESS** — deployed and verified." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DEPLOY" = "success" ] && [ "$SMOKE" = "failure" ]; then
            echo "**Status: ROLLED BACK** — deploy succeeded but smoke test failed. Automatic rollback triggered." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Status: FAILED** — deployment step failed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
